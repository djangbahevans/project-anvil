name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CMake build uses vcpkg when VCPKG_ROOT points at a checkout. The runner image has one;
  # system packages are used here instead.
  VCPKG_ROOT: ""

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: scripts/format.sh --check

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-clang-debug, linux-gcc-debug, linux-clang-asan]
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build libgtest-dev \
            nlohmann-json3-dev libpcre2-dev qt6-base-dev libgl1-mesa-dev libxkbcommon-dev fonts-dejavu-core

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g pnpm@12.8.1

      - name: Cache the VS Code checkout
        uses: actions/cache@v6
        with:
          path: .deps
          key: vscode-${{ hashFiles('scripts/fetch-vscode.sh') }}

      - name: Fetch VS Code for the extension host tests
        run: scripts/fetch-vscode.sh

      - name: Check the generated proxy identifiers
        run: node scripts/generate-proxy-ids.mjs --check

      - name: Check the Codicons font and its table
        run: node scripts/generate-codicons.mjs --check

      - name: Check the key table and the recorded key binding cases
        run: |
          node scripts/generate-key-table.mjs --check
          node scripts/generate-key-chord-cases.mjs --check
          node scripts/generate-keybinding-cases.mjs --check

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
